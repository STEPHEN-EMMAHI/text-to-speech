<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="A text-to-speech project" />
    <link rel="icon" type="image/png" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>text-to-speech</title>
  </head>
  <body>
    <!-- main -->
    <main
      class="overall-container h-screen flex flex-col justify-center items-center gap-4 w-full"
    >
      <h1 class="heading text-3xl text-center font-bold">
        Text To Speech
        <span class="text-[#FF6600] block">Converter</span>
      </h1>

      <!-- textarea -->
      <textarea
        name="text"
        id="text"
        class="bg-[#042352] w-[95%] md:w-[80%] lg:w-[60%] h-40 border caret-white text-white p-2"
        placeholder="Enter text"
        autofocus
      ></textarea>

      <!-- select -->
      <div
        class="flex flex-col-reverse md:flex-row w-[90%] md:w-[80%] lg:w-[60%] justify-between gap-4 font-bold text-sm"
      >
        <select
          name="speech-lang"
          id="speech-lang"
          class="bg-[#042352] text-white md:w-[60%] lg:w-[50%] p-1 rounded-[0.4em] appearance-none"
        ></select>
        <!-- clear -->
        <button
          class="clear-all border bg-[#F86F00] text-white w-[20%] lg:w-[15%] p-1 rounded-[0.4em] lg:cursor-pointer"
        >
          Clear
        </button>
        <!-- listen -->
        <button
          class="listen-speech border bg-[#F86F00] text-white w-[20%] lg:w-[15%] p-1 rounded-[0.4em] lg:cursor-pointer"
        >
          Listen
        </button>
      </div>
    </main>
    <script type="module" src="/src/controller/main.js"></script>
  </body>
</html>
